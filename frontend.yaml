apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: crow-fitness
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crow-fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/agersk0v/crow-fitness-frontend:latest # {"$imagepolicy": "flux-system:fitness:tag"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              value: http://api:8080
            - name: ENABLE_DEV_RESET
              value: "false"
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
